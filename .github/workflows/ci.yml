name: PipelineX CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint FinSight API
        run: ruff check finsight/api/

      - name: Lint FinSight ML
        run: ruff check finsight/ml/ --ignore F401,F841

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r finsight/requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest finsight/tests/ -v

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build API image
        run: docker build -f Dockerfile.api -t pipelinex-api:ci .

      - name: Build Frontend image
        run: docker build -f Dockerfile.frontend -t pipelinex-frontend:ci .

  security-scan:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build API image for scanning
        run: docker build -f Dockerfile.api -t pipelinex-api:ci .

      - name: Run Trivy on API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pipelinex-api:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Build Frontend image for scanning
        run: docker build -f Dockerfile.frontend -t pipelinex-frontend:ci .

      - name: Run Trivy on Frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pipelinex-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
